services:
  - type: web
    name: prudential-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard/server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: GOOGLE_SHEET_URL
        value: https://docs.google.com/spreadsheets/d/1yMkfCsuZplCqzpnyCYcCkM_AP4J3fNmFCPlTR5FSlgs
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
